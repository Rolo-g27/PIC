# Configuration file for PIC Raspberry Pi File Transfer & Decryption
# All values in hexadecimal format

[smartcard]
# PIN (4 bytes = 8 hex characters)
# Default: 01 02 03 04
pin = 01020304

[crypto]
# Symmetric key - AES-128 (16 bytes = 32 hex characters)
# This MUST match the key used by Inês for encryption
symmetric_key = 00112233445566778899aabbccddeeff

# Initialization Vector (16 bytes = 32 hex characters)
# Required for CBC and CTR modes
iv = 0f0e0d0c0b0a09080706050403020100

# Encryption mode: CBC or CTR
# CBC = Cipher Block Chaining
# CTR = Counter mode
mode = CBC

[local]
# Output directory for decrypted files
output_dir = ./downloads
